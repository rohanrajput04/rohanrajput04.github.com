project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!CLAUDE.md"
    - "!walkthrough.qmd"
    - "!notes/_template/"

website:
  title: "AI With Rohan"
  description: "Visual deep dives into how large AI systems are trained, served, and turned into agents."
  site-url: "https://rohanrajput04.github.io"

  # SEO: Open Graph & Twitter Cards
  open-graph: true
  twitter-card:
    card-style: summary_large_image

  # Search
  search:
    location: navbar
    type: overlay

  # Navigation
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Home
      - href: series.qmd
        text: Series
      - href: posts.qmd
        text: All posts
      - href: courses.qmd
        text: Courses
      # Enable Notes once notes.qmd is no longer a draft and notes/ has real entries.
      # - href: notes.qmd
      #   text: Notes
      # Enable Talks once talks.qmd has real entries (remove `draft: true` there too).
      # - href: talks.qmd
      #   text: Talks
      - href: about.qmd
        text: About
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/rohan3
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/rohanrajput04
        aria-label: GitHub
      - icon: rss
        href: posts.xml
        aria-label: RSS

  # Footer
  page-footer:
    left: "Built with [Quarto](https://quarto.org) · Views are my own"
    right: "&copy; 2024–2026 Rohan Rajput"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    highlight-style:
      light: github
      dark: monokai
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: false
    code-copy: true
    code-line-numbers: true
    fontsize: 1.05em
    linestretch: 1.6

execute:
  freeze: auto
