project:
  type: website
  output-dir: _site

website:
  title: "AI With Rohan"
  description: "Deep dives into AI, ML, and distributed systems"
  site-url: "https://rohanrajput04.github.io"

  # SEO: Open Graph & Twitter Cards
  open-graph: true
  twitter-card:
    card-style: summary_large_image

  # Search
  search:
    location: navbar
    type: overlay

  # Navigation
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Home
      - href: posts.qmd
        text: Blog
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/rohanrajput04
      - icon: rss
        href: posts.xml

  # Footer
  page-footer:
    left: "Built with [Quarto](https://quarto.org)"
    right: "&copy; 2024 AI With Rohan"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    highlight-style:
      light: github
      dark: monokai
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    code-copy: true
    code-line-numbers: true
    fontsize: 1.05em
    linestretch: 1.6

execute:
  freeze: auto
